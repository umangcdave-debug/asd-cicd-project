
name: ASD CI CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Download Project Code
        uses: actions/checkout@v4

      - name: Check Website File
        run: test -f index.html

      - name: Test Website Content
        run: grep -q "Hello, ASD!" index.html

      - name: Prepare Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
